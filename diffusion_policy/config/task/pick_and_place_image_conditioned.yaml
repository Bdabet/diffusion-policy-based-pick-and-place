name: pick_and_place_image_conditioned

image_shape: [3, 240, 320]
dataset_path: data/pusht_real/real_pusht_20230105

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    camera_0:
      shape: ${task.image_shape}
      type: rgb
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    camera_2:
      shape: ${task.image_shape}
      type: rgb
    camera_0_last_frame:
      shape: ${task.image_shape}
      type: rgb
    # camera_1_last_frame:
    #   shape: ${task.image_shape}
    #   type: rgb
    # camera_2_last_frame:
    #   shape: ${task.image_shape}
    #   type: rgb

    robot_eef_pose:
      shape: [6]
      type: low_dim
    gripper_state:
      shape: [1]
      type: low_dim
  action: 
    shape: [7] # robot_pose + gripper state

env_runner:
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: diffusion_policy.dataset.pick_and_place_dataset_image_conditioned.PickPlaceDatasetConditioned
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
  delta_action: False

