name: pick_and_place_image_conditioned_yaw

image_shape: [3, 240, 320]
dataset_path: data/pusht_real/real_pusht_20230105
weighted_loss: False

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    # camera_0:
    #   shape: ${task.image_shape}
    #   type: rgb
    camera_1:
      shape: ${task.image_shape}
      type: rgb
    camera_2:
      shape: ${task.image_shape}
      type: rgb
    # camera_0_last_frame:
    #   shape: ${task.image_shape}
    #   type: rgb
    camera_1_last_frame:
      shape: ${task.image_shape}
      type: rgb
    # camera_2_last_frame:
    #   shape: ${task.image_shape}
    #   type: rgb

    robot_eef_pose_yaw:
      shape: [4]
      type: low_dim
    gripper_state:
      shape: [1]
      type: low_dim
     
  action: 
    shape: [5] # robot_pose + gripper state

env_runner:
  _target_: diffusion_policy.env_runner.real_pusht_image_runner.RealPushTImageRunner

dataset:
  _target_: diffusion_policy.dataset.pick_and_place_dataset_image_conditioned.PickPlaceDatasetConditioned
  shape_meta: *shape_meta
  dataset_path: ${task.dataset_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  n_latency_steps: ${n_latency_steps}
  use_cache: True
  seed: 42
  val_ratio: 0.00
  max_train_episodes: null
  delta_action: False
  use_flags: False
  enable_augmentation: True  # Set to False for validation
  aug_brightness_range: [0.7, 1.3]
  aug_contrast_range: [0.7, 1.3]
  aug_gamma_range: [0.7, 1.5]
  aug_probability: 0.8  # Apply to 80% of samples

